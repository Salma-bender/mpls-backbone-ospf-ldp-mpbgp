! Exemple : MP-BGP VPNv4 sur PE1 (AS 1) - reconstitué à partir des commandes du rapport (section 13.5)
! PE2 et PE3 : même structure, en échangeant les voisins (cf. loopbacks du schéma)
router bgp 1
 neighbor 20.20.20.20 remote-as 1
 neighbor 30.30.30.30 remote-as 1
 neighbor 20.20.20.20 update-source Loopback0
 neighbor 30.30.30.30 update-source Loopback0
 no auto-summary
 !
 address-family vpnv4
  neighbor 20.20.20.20 activate
  neighbor 30.30.30.30 activate
 exit-address-family
