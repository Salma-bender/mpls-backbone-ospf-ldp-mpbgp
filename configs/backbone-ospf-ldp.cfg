! Backbone (PE1, PE2, PE3, P1, P2, P3) - reconstitué à partir des commandes du rapport (sections 13.1 et 13.4)
! Chaque interface backbone est dans OSPF 1 area 0 (ex. "ip ospf 1 area 0" sous l'interface)
router ospf 1
 mpls ldp autoconfig
!
! Vérifications utilisées dans le rapport :
!   show ip route ospf
!   ping 20.20.20.20 / ping 30.30.30.30
!   show mpls interface
!   show mpls ldp neighbor
!   show bgp vpnv4 unicast all summary
